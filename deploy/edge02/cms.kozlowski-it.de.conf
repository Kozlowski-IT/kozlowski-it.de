# cms.kozlowski-it.de — CMS (Plan 2, Task 7). TLS edge02, Login+Rolle cms-editor per oauth2-proxy (127.0.0.1:4180), dann via WG -> DMZ-85 (10.30.85.2:3000)
server {
    listen 80;
    server_name cms.kozlowski-it.de;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://cms.kozlowski-it.de$request_uri; }
}
server {
    listen 443 ssl;
    # http2 on;  # disabled: HTTP/2 connection-coalescing onto viocord /ws (shared *.kozlowski-it.de cert + IP) breaks WebSocket
    server_name cms.kozlowski-it.de;
    server_tokens off;
    ssl_certificate     /etc/nginx/certs/kozlowski-it.de/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/kozlowski-it.de/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 20m;

    location /oauth2/ {
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host                    $host;
        proxy_set_header X-Real-IP               $remote_addr;
        proxy_set_header X-Forwarded-For         $remote_addr;
        proxy_set_header X-Forwarded-Proto       https;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }
    location = /oauth2/auth {
        internal;
        proxy_pass http://127.0.0.1:4180;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Content-Length    "";
        proxy_pass_request_body off;
    }
    location @cms_login { return 302 /oauth2/start?rd=$request_uri; }
    # CSRF-Schutz zusätzlich zu SameSite=Lax: schreibende Requests nur ohne Origin oder mit eigener Origin
    set $cms_csrf "";
    if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { set $cms_csrf "w"; }
    if ($http_origin !~ ^(https://cms\.kozlowski-it\.de)?$) { set $cms_csrf "${cms_csrf}x"; }
    if ($cms_csrf = "wx") { return 403; }
    # Abmelden in Payload beendet auch die Edge-Session (sonst sofort wieder per Header eingeloggt)
    location = /admin/logout { return 302 /oauth2/sign_out?rd=https%3A%2F%2Fcms.kozlowski-it.de%2Foauth2%2Fsign_in; }
    # Passwort-Login nur intern (Break-Glass): öffentlich gesperrt
    location ~ ^/api/users/(login|forgot-password|reset-password|first-register|unlock)$ { return 403; }
    location = /admin/create-first-user { return 403; }
    location ~ ^/admin/(login|forgot|reset) { return 403; }
    location / {
        auth_request /oauth2/auth;
        error_page 401 = @cms_login;
        auth_request_set $cms_email  $upstream_http_x_auth_request_email;
        auth_request_set $cms_groups $upstream_http_x_auth_request_groups;

        proxy_pass http://10.30.85.2:3000;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $remote_addr;
        proxy_set_header X-Forwarded-Proto  https;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;
        # Identität NUR von oauth2-proxy; Client-Werte werden immer überschrieben
        proxy_set_header X-Auth-Request-Email  $cms_email;
        proxy_set_header X-Auth-Request-Groups $cms_groups;
        include /etc/nginx/snippets/cms-edge-secret.conf;
        proxy_connect_timeout 5s;
        proxy_read_timeout    300s;
    }
}
