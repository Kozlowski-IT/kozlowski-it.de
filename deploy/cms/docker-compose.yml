# CMS-Stack kozlowski-it.de — docker01:/opt/docker/apps/cms/ (Daten: /opt/docker-data/cms/)
#
#   postgres  nur cms_db (internal), keine Ports
#   payload   10.30.85.2:3000  Admin hinter edge02/oauth2-proxy (cms.kozlowski-it.de)
#   preview   10.30.85.3:80    Vorschau (cms-vorschau.kozlowski-it.de), liest workDir read-only
#   builder   10.30.85.4:4100  Export → Eleventy → releases/current (nur payload spricht ihn an)
#
# Secrets + Image-Tag kommen aus ./.env (mode 600, Vorlage env.example), nie aus dem Repo.
# Prüfung: npm run check:deploy (statisch) bzw. docker compose config -q (docker01).
name: cms

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    <<: *hardening
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    # Entrypoint chownt PGDATA und wechselt per gosu auf uid 999
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: cms
      POSTGRES_DB: cms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
    volumes:
      # Postgres 18: PGDATA = /var/lib/postgresql/18/docker → Elternordner mounten
      - /opt/docker-data/cms/pgdata:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d cms"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      cms_db:
        ipv4_address: 172.31.85.2

  payload:
    <<: *hardening
    image: kozlowski/pk-cms:${CMS_IMAGE_TAG:?CMS_IMAGE_TAG fehlt in .env}
    user: "1000:1000"
    init: true
    working_dir: /app
    # Startsperre: ohne https-Server-URL, Edge-Secret (≥ 32), PAYLOAD_SECRET, DATABASE_URL, NODE_ENV=production kein Start
    command: ["sh", "/app/deploy/cms/payload-start.sh", "npm", "--prefix", "cms", "start", "--", "-H", "0.0.0.0", "-p", "3000"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://cms:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}@postgres:5432/cms
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET fehlt in .env}
      PAYLOAD_PUBLIC_SERVER_URL: https://cms.kozlowski-it.de
      EDGE_SHARED_SECRET: ${EDGE_SHARED_SECRET:?EDGE_SHARED_SECRET fehlt in .env}
      BUILDER_URL: http://10.30.85.4:4100
      BUILDER_TOKEN: ${BUILDER_TOKEN:?BUILDER_TOKEN fehlt in .env}
      PREVIEW_URL: https://cms-vorschau.kozlowski-it.de
    volumes:
      # resolv-clean.conf ersetzt Dockers eingebetteten DNS (127.0.0.11); Dockers eigene /etc/hosts ist auf docker01
      # (Default-ACL) für uid 1000 unlesbar → eigene ./hosts mappt den Dienstnamen postgres auf die feste IP
      - ./resolv-clean.conf:/etc/resolv.conf:ro
      - ./hosts:/etc/hosts:ro
      - /opt/docker-data/cms/media:/app/cms/media
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      dmz_cms:
        ipv4_address: 10.30.85.2
      cms_db: {}

  builder:
    <<: *hardening
    image: kozlowski/pk-cms:${CMS_IMAGE_TAG:?CMS_IMAGE_TAG fehlt in .env}
    user: "1000:1000"
    init: true
    # cwd cms/: tsx lädt den TS-Export samt @/-Pfaden aus cms/tsconfig.json
    working_dir: /app/cms
    command: ["node", "--import", "tsx", "../builder/src/server.mjs"]
    # laufender Publish darf zu Ende laufen (server.close wartet auf die Queue)
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://cms:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}@postgres:5432/cms
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET fehlt in .env}
      BUILDER_TOKEN: ${BUILDER_TOKEN:?BUILDER_TOKEN fehlt in .env}
      BUILDER_HOST: 0.0.0.0
      BUILDER_PORT: "4100"
      BUILDER_WORKDIR: /srv/work
      BUILDER_SITE_ROOT: /app
      BUILDER_EXPORT_MODULE: /app/cms/src/export/builderExport.ts
      BUILDER_GIT_REPO: /srv/repo
      BUILDER_GIT_NAME: kozlowski-it Builder
      BUILDER_GIT_EMAIL: builder@kozlowski-it.de
      GIT_SSH_COMMAND: ssh -i /home/node/.ssh/id_ed25519 -o IdentitiesOnly=yes -o UserKnownHostsFile=/home/node/.ssh/known_hosts -o StrictHostKeyChecking=yes
    volumes:
      # resolv-clean.conf ersetzt Dockers eingebetteten DNS (127.0.0.11); Dockers eigene /etc/hosts ist auf docker01
      # (Default-ACL) für uid 1000 unlesbar → eigene ./hosts mappt den Dienstnamen postgres auf die feste IP
      - ./resolv-clean.conf:/etc/resolv.conf:ro
      - ./hosts:/etc/hosts:ro
      - /opt/docker-data/cms/work:/srv/work
      - /opt/docker-data/cms/repo:/srv/repo
      - /opt/docker-data/cms/ssh:/home/node/.ssh:ro
      # gemeinsam mit payload (Carry g); rw, weil `npm run seed` hier Medien ablegt
      - /opt/docker-data/cms/media:/app/cms/media
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      dmz_cms:
        ipv4_address: 10.30.85.4
      cms_db: {}

  preview:
    <<: *hardening
    image: nginx:alpine
    read_only: true
    # wie landing: nginx-Master braucht diese Rechte für Worker-Nutzer + Port 80
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    volumes:
      - ./resolv-clean.conf:/etc/resolv.conf:ro
      - ./preview-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # GANZER workDir: preview ist ein relativer Symlink auf .previews/<id>
      - /opt/docker-data/cms/work:/srv/work:ro
    networks:
      dmz_cms:
        ipv4_address: 10.30.85.3

networks:
  dmz_cms:
    # macvlan, parent ens20.85, 10.30.85.0/29 — existiert schon auf docker01
    external: true
  cms_db:
    name: cms_db
    driver: bridge
    internal: true
    # feste Adressen .2–.7 (postgres .2); dynamische nur aus ip_range .8–.15 → keine Kollision nach Reboot
    ipam:
      config:
        - subnet: 172.31.85.0/28
          gateway: 172.31.85.1
          ip_range: 172.31.85.8/29
