# Vorschau cms-vorschau.kozlowski-it.de (hinter edge02 + oauth2-proxy, gleicher Login wie Admin).
# root folgt dem relativen Symlink /srv/work/preview → .previews/<id> (deshalb ganzer workDir gemountet).
# Kein open_file_cache: nach dem atomaren Umbiegen des Symlinks sofort der neue Stand.
server {
    listen 80;
    server_name _;

    root /srv/work/preview;
    index index.html;
    error_page 404 /404.html;

    # Header NUR hier auf server-Ebene: add_header in einem location-Block würde sie still verwerfen.
    # Entwürfe nie indexieren; nur der Admin (Live-Vorschau) darf einbetten; nichts cachen
    # (Auto-Reload fragt /__build.txt ab).
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "frame-ancestors https://cms.kozlowski-it.de" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    server_tokens off;
    autoindex off;

    location / {
        try_files $uri $uri/ =404;
    }
}
