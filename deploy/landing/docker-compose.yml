# landing (kozlowski-it.de) — docker01:/opt/docker/apps/landing/
# Gehärtet wie bisher; einzige Änderung: Inhalt kommt aus releases/current des CMS-Builders
# statt aus dem Image/Bind-Mount von _site.
services:
  landing:
    image: nginx:alpine
    container_name: landing
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    volumes:
      - ./nginx-default.conf:/etc/nginx/conf.d/default.conf:ro
      # Ordner releases/ (NICHT releases/current) read-only — current ist ein relativer Symlink darin
      - /opt/docker-data/cms/work/releases:/srv/releases:ro
    networks:
      macvlan78:
        ipv4_address: 10.30.78.2

networks:
  macvlan78:
    external: true
