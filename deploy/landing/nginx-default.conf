# landing (kozlowski-it.de) — liefert den aktuellen Builder-Release aus.
# Gemountet ist der Ordner releases/ (read-only); current ist ein RELATIVER Symlink auf
# releases/<name> und wird vom Builder atomar umgebogen. Niemals den Symlink selbst mounten.
# Security-Header/CSP setzt edge02 (kozlowski-it.de.conf) — hier bewusst keine.
server {
    listen 80;
    server_name localhost;

    root /srv/releases/current;
    index index.html;
    error_page 404 /404.html;
}
