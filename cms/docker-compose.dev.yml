# Optionale lokale Postgres-Instanz (Alternative zum user-level Postgres).
# Start: docker compose -f cms/docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    ports:
      - '127.0.0.1:5433:5432'
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms-dev  # nur Dev
      POSTGRES_DB: cms
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
